name: houseplant-tracker

# Release setup: bundled API on plain Node, production frontend served by nginx.
# For hot reload while developing, add the dev override:
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: release
    init: true
    restart: unless-stopped
    environment:
      PORT: 3000
      STORAGE_DIR: /app/storage
      CATALOG_DIR: /app/species-catalog
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-15}
      # Fewer glibc malloc arenas, so memory freed after image processing goes back to the system.
      MALLOC_ARENA_MAX: "2"
      # AI features. Only this service gets the key; the web container and browser never do.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      # Web Push keys, created once with `npm run push:keys -w apps/api -- --subject mailto:you@example.com`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # The app's HTTPS address for phones (from `tailscale serve`), shown in Settings.
      APP_URL: ${APP_URL:-}
    volumes:
      # Persistent user data: SQLite database + uploaded photos.
      - ./storage:/app/storage
      # Version-controlled species reference data, read-only.
      - ./species-catalog:/app/species-catalog:ro
    ports:
      # Published on localhost only; LAN devices go through the web proxy.
      - "127.0.0.1:${API_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: release
    init: true
    restart: unless-stopped
    ports:
      # All interfaces, so phones on the local network can reach it.
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started
