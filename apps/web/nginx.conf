# Serves the production build and proxies /api to the api service.

# Like Vite's dev server, only answer for localhost, IP addresses and *.local
# names. This allow-list protects the API against DNS-rebinding attacks.
server {
    listen 5173 default_server;
    return 403;
}

server {
    listen 5173;
    server_name localhost .local ~^\d+\.\d+\.\d+\.\d+$ ~^\[[0-9a-fA-F:.]+\]$;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        # Re-resolve the service name so a recreated api container is picked up.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The API enforces its own (configurable) upload limit with a clear error.
        client_max_body_size 64m;
        # AI requests can take tens of seconds; the API's own timeout (AI_TIMEOUT_MS) answers first.
        proxy_read_timeout 120s;
    }

    # Hashed build output never changes at a given URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html; always revalidate it.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
